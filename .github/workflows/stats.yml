name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARD_TOKEN }}
        with:
          USERNAME: Nilaksh7

      - name: Inject Custom Transparent & Red Theme
        run: |
          sed -i 's/fill="#151515"/fill="none"/g' profile-summary-card-output/dark/*.svg
          sed -i 's/fill="#000000"/fill="none"/g' profile-summary-card-output/dark/*.svg
          sed -i 's/fill="#79ff97"/fill="#FF0033"/g' profile-summary-card-output/dark/*.svg

      - name: Generate Animated Crimson Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nilaksh7
          # Injects Pure Black background and Red/Crimson gradient for the dots
          outputs: |
            dist/github-snake.svg?color_snake=#FF0033&color_dots=#000000,#40000C,#800019,#BF0026,#FF0033
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          git add dist/github-snake.svg
          git diff --staged --quiet || git commit -m "Update GitHub stats and Snake [automated]"
          git push
