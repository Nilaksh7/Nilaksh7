name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARD_TOKEN }}
        with:
          USERNAME: Nilaksh7

      - name: Inject Custom Transparent & Red Theme
        run: |
          sed -i 's/fill="#151515"/fill="none"/g' profile-summary-card-output/dark/*.svg
          sed -i 's/fill="#000000"/fill="none"/g' profile-summary-card-output/dark/*.svg
          sed -i 's/fill="#79ff97"/fill="#FF0033"/g' profile-summary-card-output/dark/*.svg

      - name: Generate Professional Activity Line Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Nilaksh7
          options: 'theme=react-dark&bg_color=00000000&color=ffffff&line=FF0033&point=FF0033&area=true&area_color=FF0033&hide_border=true'
          output_path: activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          git add activity-graph.svg
          git diff --staged --quiet || git commit -m "Update GitHub stats and Activity Graph [automated]"
          git push
