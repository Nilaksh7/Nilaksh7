name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARD_TOKEN }}
        with:
          USERNAME: Nilaksh7

      - name: Inject Custom Transparent & Red Theme
        run: |
          # Forcefully strips both default gray AND our previous pure black into transparency
          sed -i 's/fill="#151515"/fill="none"/g' profile-summary-card-output/dark/*.svg
          sed -i 's/fill="#000000"/fill="none"/g' profile-summary-card-output/dark/*.svg
          
          # Injects the Miles Morales Crimson Red
          sed -i 's/fill="#79ff97"/fill="#FF0033"/g' profile-summary-card-output/dark/*.svg

      - name: Commit and push generated cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          git diff --staged --quiet || git commit -m "Update GitHub stats [automated]"
          git push
