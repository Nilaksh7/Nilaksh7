name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARD_TOKEN }}
        with:
          USERNAME: Nilaksh7

      - name: Inject Custom Transparent & Red Theme
        run: |
          sed -i 's/fill="#151515"/fill="none"/g' profile-summary-card-output/dark/*.svg
          sed -i 's/fill="#000000"/fill="none"/g' profile-summary-card-output/dark/*.svg
          sed -i 's/fill="#79ff97"/fill="#FF0033"/g' profile-summary-card-output/dark/*.svg

      - name: Fetch Live Activity Graph
        run: |
          # Downloads your graph directly from the API
          curl -L -o activity-graph.svg "https://github-readme-activity-graph.vercel.app/graph?username=Nilaksh7&theme=react-dark&bg_color=transparent&color=ffffff&line=FF0033&point=FF0033&area=true&area_color=FF0033&hide_border=true"
          
          # Safety check: If the API is down and returns an error instead of an image, discard the broken download
          if ! grep -q "<svg" activity-graph.svg; then
            echo "API returned an error. Reverting to yesterday's graph."
            git checkout activity-graph.svg || rm activity-graph.svg
          fi

     - name: Commit and push generated cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          
          # Safely add the graph only if it successfully downloaded
          git add activity-graph.svg || true
          
          git diff --staged --quiet || git commit -m "Update GitHub stats and Activity Graph [automated]"
          git push
