name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: vn7n24f211202/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARD_TOKEN }}
        with:
          USERNAME: Nilaksh7

      - name: Inject Custom Red & Black Theme
        run: |
          # Replaces default dark gray background with pure black
          sed -i 's/#151515/#000000/g' profile-summary-card-output/dark/*.svg
          # Replaces default neon green with crimson red
          sed -i 's/#79ff97/#FF0033/g' profile-summary-card-output/dark/*.svg

      - name: Commit and push generated cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Recursively adds all files in the output directory
          git add profile-summary-card-output/
          git diff --staged --quiet || git commit -m "Update GitHub stats [automated]"
          git push
