<svg width="850" height="520" viewBox="0 0 850 520"
     xmlns="http://www.w3.org/2000/svg">

<defs>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity=".25"/>
    <stop offset="55%" stop-color="#2563eb" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="5" stdDeviation="6"
                  flood-color="#000" flood-opacity=".45"/>
  </filter>

  <style>
    .icon {
      animation: float 4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .i2 { animation-delay: -.7s; }
    .i3 { animation-delay: -1.4s; }
    .i4 { animation-delay: -2.1s; }
    .i5 { animation-delay: -2.8s; }
    .i6 { animation-delay: -3.5s; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .orbit {
      fill: none;
      stroke: #6366f1;
      stroke-opacity: .18;
      stroke-width: 1;
    }

    .dot {
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: .25; }
      50% { opacity: 1; }
    }
  </style>
</defs>

<!-- subtle central glow -->
<ellipse cx="425" cy="260" rx="300" ry="210"
         fill="url(#glow)" filter="url(#blur)"/>

<!-- orbital paths -->
<ellipse class="orbit" cx="425" cy="260" rx="330" ry="190"/>
<ellipse class="orbit" cx="425" cy="260" rx="245" ry="135"
         transform="rotate(-22 425 260)"/>
<ellipse class="orbit" cx="425" cy="260" rx="180" ry="105"
         transform="rotate(25 425 260)"/>

<!-- decorative particles -->
<circle class="dot" cx="94" cy="250" r="3" fill="#22d3ee"/>
<circle class="dot" cx="745" cy="185" r="3" fill="#a78bfa"/>
<circle class="dot" cx="690" cy="390" r="2.5" fill="#34d399"/>
<circle class="dot" cx="180" cy="395" r="2.5" fill="#60a5fa"/>
<circle class="dot" cx="425" cy="62" r="2" fill="#c084fc"/>

<!-- icons -->
<g filter="url(#shadow)">

  <image class="icon i1"
    href="https://skillicons.dev/icons?i=c"
    x="385" y="35" width="70" height="70"/>

  <image class="icon i2"
    href="https://skillicons.dev/icons?i=cpp"
    x="510" y="65" width="70" height="70"/>

  <image class="icon i3"
    href="https://skillicons.dev/icons?i=js"
    x="615" y="135" width="70" height="70"/>

  <image class="icon i4"
    href="https://skillicons.dev/icons?i=ts"
    x="650" y="245" width="70" height="70"/>

  <image class="icon i5"
    href="https://skillicons.dev/icons?i=python"
    x="590" y="350" width="70" height="70"/>

  <image class="icon i6"
    href="https://skillicons.dev/icons?i=react"
    x="470" y="410" width="70" height="70"/>

  <image class="icon i1"
    href="https://skillicons.dev/icons?i=html"
    x="340" y="405" width="70" height="70"/>

  <image class="icon i2"
    href="https://skillicons.dev/icons?i=css"
    x="210" y="350" width="70" height="70"/>

  <image class="icon i3"
    href="https://skillicons.dev/icons?i=tailwind"
