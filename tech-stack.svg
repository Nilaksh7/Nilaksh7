  <image class="icon i5"
    href="https://skillicons.dev/icons?i=nodejs"
    x="255" y="65" width="70" height="70"/>

  <image class="icon i6"
    href="https://skillicons.dev/icons?i=express"
    x="335" y="145" width="70" height="70"/>

  <image class="icon i1"
    href="https://skillicons.dev/icons?i=fastapi"
    x="410" y="150" width="70" height="70"/>

  <image class="icon i2"
    href="https://skillicons.dev/icons?i=mongodb"
    x="330" y="250" width="70" height="70"/>

  <image class="icon i3"
    href="https://skillicons.dev/icons?i=postgres"
