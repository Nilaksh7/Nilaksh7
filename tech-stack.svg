</g>

<!-- center -->
<circle cx="425" cy="260" r="42"
        fill="#111827"
        stroke="#6366f1"
        stroke-width="1.5"/>

<text x="425" y="255"
      text-anchor="middle"
      fill="#e5e7eb"
      font-family="monospace"
      font-size="13"
      font-weight="600">
  BUILD
</text>

<text x="425" y="274"
      text-anchor="middle"
      fill="#60a5fa"
      font-family="monospace"
      font-size="10">
  • CREATE •
